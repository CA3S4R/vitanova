<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<main class="auth-container">

<h1>Create Account</h1>


<form
action="/signup"
method="POST">


<label for="username">
Username
</label>

<input
id="username"
type="text"
name="username"
required
minlength="3"
autocomplete="username">


<label for="email">
Email
</label>

<input
id="email"
type="email"
name="email"
required
autocomplete="email">


<label for="password">
Password
</label>

<input
id="password"
type="password"
name="password"
required
minlength="8"
autocomplete="new-password">


<button type="submit">
Create Account
</button>

</form>


<p>
Already have an account?
<a href="/login.html">
Log in
</a>
</p>

</main>

</body>

</html>
