<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Log In</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<main class="auth-container">

<h1>Log In</h1>


<form
action="/login"
method="POST">


<label for="email">
Email
</label>

<input
id="email"
type="email"
name="email"
required
autocomplete="email">


<label for="password">
Password
</label>

<input
id="password"
type="password"
name="password"
required
autocomplete="current-password">


<button type="submit">
Log In
</button>

</form>


<p>
Don't have an account?
<a href="/signup.html">
Create one
</a>
</p>

</main>

</body>

</html>
